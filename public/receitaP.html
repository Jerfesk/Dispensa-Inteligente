<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Receita</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #387d39;
            --bg-light: #f1f6e9;
            --text-dark: #1a461a;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        /* Container do "Celular" */
        .app-container {
            width: 375px;
            height: 812px;
            background: var(--white);
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        /* Conteúdo com Scroll */
        .content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px; /* Espaço para o botão inferior */
        }

        .header-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .recipe-body {
            padding: 20px;
        }

        .recipe-title {
            color: var(--text-dark);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;
            text-align: center;
        }

        .info-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            color: #666;
            font-size: 14px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin: 20px 0 10px;
            color: var(--text-dark);
        }

        .list-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .check-icon {
            width: 20px;
            height: 20px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 12px;
        }

        .step-number {
            min-width: 24px;
            height: 24px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-weight: bold;
        }

        /* NOVO: Área inferior contendo apenas o botão de voltar */
        .bottom-action {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 75px;
            background: var(--white);
            border-top: 1px solid #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px 15px;
        }

        .btn-voltar {
            width: 100%;
            height: 48px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow);
            transition: background 0.2s;
        }

        .btn-voltar:active {
            transform: scale(0.98);
            background: #2d632e;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="content">
        <img id="img-receita" src="https://images.unsplash.com/photo-1546549032-9571cd6b27df?q=80&w=500" alt="Imagem da Receita" class="header-image">
        
        <div class="recipe-body">
            <h1 id="titulo-receita" class="recipe-title">Carregando receita...</h1>
            
            <div class="info-bar">
                <span id="tempo-receita">⏱️ -- min</span>
                <span id="dificuldade-receita">😊 --</span>
                <span id="porcoes-receita">👥 -- porções</span>
            </div>

            <h2 class="section-title">Ingredientes</h2>
            <div id="container-ingredientes">
                <p style="color: #888;">Buscando os melhores ingredientes...</p>
            </div>

            <h2 class="section-title">Modo de preparo</h2>
            <div id="container-passos">
                <p style="color: #888;">Preparando o fogão...</p>
            </div>
        </div>
    </div>

    <div class="bottom-action">
        <button class="btn-voltar" onclick="voltarParaBusca()">
            <span>⬅️</span> Voltar para as sugestões
        </button>
    </div>
</div>

<script>
    // 1. Pega o nome da receita enviado na URL de forma segura
    const urlParams = new URLSearchParams(window.location.search);
    let nomeReceita = urlParams.get('nome');

    // Fallback caso a string venha crua sem tratamento correto do navegador
    if (!nomeReceita && window.location.href.includes('nome=')) {
        nomeReceita = window.location.href.split('nome=')[1];
    }

    const token = localStorage.getItem('token'); 

    if (!nomeReceita) {
        alert('Nenhuma receita selecionada!');
        voltarParaBusca();
    } else {
        nomeReceita = decodeURIComponent(nomeReceita);
        carregarDetalhesDaReceita();
    }

    // Função para voltar para a tela anterior
    function voltarParaBusca() {
        // Redireciona de volta para a sua página de busca (sugestReceitaT.html)
        window.location.href = 'sugestReceitaT.html';
    }

    // 2. Busca os dados reais com a IA do seu backend
    function carregarDetalhesDaReceita() {
        fetch(`/receita/${encodeURIComponent(nomeReceita)}`, {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (!response.ok) throw new Error('Erro na requisição ou token inválido.');
            return response.json();
        })
        .then(receita => {
            // Renderiza as informações básicas
            document.getElementById('titulo-receita').innerText = receita.nome || nomeReceita;
            document.getElementById('tempo-receita').innerText = `⏱️ ${receita.tempo || '25 min'}`;
            document.getElementById('dificuldade-receita').innerText = `😊 ${receita.dificuldade || 'Fácil'}`;
            document.getElementById('porcoes-receita').innerText = `👥 ${receita.porcoes || '2 porções'}`;

            // Renderiza Ingredientes
            const containerIngredientes = document.getElementById('container-ingredientes');
            containerIngredientes.innerHTML = '';
            if (receita.ingredientes && receita.ingredientes.length > 0) {
                receita.ingredientes.forEach(ing => {
                    containerIngredientes.innerHTML += `<div class="list-item"><span class="check-icon">✓</span> ${ing}</div>`;
                });
            } else {
                containerIngredientes.innerHTML = '<p>Nenhum ingrediente listado pela IA.</p>';
            }

            // Renderiza Modo de Preparo (Usando .preparo que seu backend retorna)
            const containerPassos = document.getElementById('container-passos');
            containerPassos.innerHTML = '';
            if (receita.preparo && receita.preparo.length > 0) {
                receita.preparo.forEach((passo, index) => {
                    containerPassos.innerHTML += `
                        <div class="list-item">
                            <span class="step-number">${index + 1}</span>
                            <p>${passo}</p>
                        </div>`;
                });
            } else {
                containerPassos.innerHTML = '<p>Não foi possível estruturar o modo de preparo.</p>';
            }
        })
        .catch(error => {
            console.error(error);
            alert('Erro ao carregar a receita. Retornando para a tela de buscas.');
            voltarParaBusca();
        });
    }
</script>

</body>
</html>
